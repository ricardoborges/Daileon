services:
  daileon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daileon
    ports:
      # Interface e API na mesma porta: http://localhost:8000
      - "8000:8000"
    environment:
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_READ_TOKEN=${GITLAB_READ_TOKEN:-${GITLAB_TOKEN:-}}
      - GITLAB_GROUP_ID=${GITLAB_GROUP_ID:-}
      - JENKINS_URL=${JENKINS_URL:-https://jenkins.example.com}
      - JENKINS_USER=${JENKINS_USER:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/daileon.db

      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-daileon-breakglass-secret-key-change-in-prod}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_SERVER_HOST=${LDAP_SERVER_HOST:-}
      - LDAP_SERVER_PORT=${LDAP_SERVER_PORT:-389}
      - LDAP_USE_SSL=${LDAP_USE_SSL:-false}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_USER_ATTRIBUTE=${LDAP_USER_ATTRIBUTE:-uid}
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      # Plugins drop-in: copiar uma pasta aqui e reiniciar o container.
      # Reservado — o carregador entra em um passo seguinte.
      - ./plugins:/app/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: daileon-network
