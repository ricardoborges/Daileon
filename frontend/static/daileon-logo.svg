<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Silver Gradients -->
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Red Energy Accent Gradient -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Cyan Visor Neon Glow -->
    <linearGradient id="cyanVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="110" fill="#0b0f19" />
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />
  <path d="M256 32 L440 120 V320 L256 464 L72 320 V120 Z" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- DAILEON MECHA HELMET & CHEST -->
  <g transform="translate(0, 10)">
    <!-- Outer Shoulder & Base Plate -->
    <path d="M120 400 L256 460 L392 400 L440 320 L380 270 L256 320 L132 270 L72 320 Z" fill="url(#metalDark)" stroke="#475569" stroke-width="3" />
    <path d="M150 360 L256 410 L362 360 L390 320 L256 345 L122 320 Z" fill="url(#redAccent)" />

    <!-- Gold Chest Emblem / Core Crest -->
    <polygon points="256,310 296,360 216,360" fill="url(#goldAccent)" stroke="#b45309" stroke-width="2" />
    <polygon points="256,325 276,350 236,350" fill="#fef08a" />

    <!-- Neck / Chin Base -->
    <path d="M196 250 L256 295 L316 250 L300 220 L212 220 Z" fill="url(#metalDark)" stroke="#1e293b" stroke-width="3" />
    
    <!-- Helmet Main Structure (Ears & Crown) -->
    <path d="M140 160 L180 80 L220 140 L256 60 L292 140 L332 80 L372 160 L360 230 L256 270 L152 230 Z" fill="url(#metalLight)" stroke="#64748b" stroke-width="4" />

    <!-- Helmet Inner Cheeks & Armor Lines -->
    <path d="M170 170 L200 240 L256 265 L312 240 L342 170 L300 160 L256 185 L212 160 Z" fill="url(#metalDark)" />

    <!-- Golden Crown Crest (Center Antenna) -->
    <path d="M256 45 L276 130 L256 160 L236 130 Z" fill="url(#goldAccent)" stroke="#78350f" stroke-width="2" />
    <polygon points="256,60 266,115 256,135 246,115" fill="#fef08a" />

    <!-- Red Side Accents (Daileon Helmet Wings) -->
    <path d="M140 160 L170 120 L190 170 Z" fill="url(#redAccent)" />
    <path d="M372 160 L342 120 L322 170 Z" fill="url(#redAccent)" />

    <!-- CYAN NEON VISOR (The Eyes/Sensor of Daileon) -->
    <path d="M185 175 L256 195 L327 175 L315 205 L256 220 L197 205 Z" fill="url(#cyanVisor)" filter="url(#neonGlow)" />
    <path d="M195 183 L256 198 L317 183 L308 200 L256 210 L204 200 Z" fill="#ecfeff" opacity="0.8" />

    <!-- Tech Grid Lines Detail -->
    <line x1="256" y1="220" x2="256" y2="265" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    <circle cx="256" cy="242" r="4" fill="#38bdf8" />
  </g>
</svg>
