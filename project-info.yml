apiVersion: daileon/v1
kind: Component
metadata:
  name: daileon-portal
  description: "Developer Portal interno inspirado no Spotify Backstage com backend Python FastAPI e frontend SvelteKit."
  tags:
    - python
    - fastapi
    - sveltekit
    - dev-portal
    - gitlab
    - backstage
  owner: team-platform-engineering
  domain: internal-tooling

spec:
  type: website
  lifecycle: production
  system: platform-engineering
  
  docs:
    dir: /docs
    index: index.md
  
  links:
    - url: http://localhost:8000/docs
      title: FastAPI OpenAPI Specs
      icon: api

  dependencies:
    - component: gitlab-api

  jenkins:
    pipelines:
      - name: Pipeline de Produção
        environment: production
        job: "deployments/daileon-prod"
      - name: Testes Automáticos & CI
        environment: test
        job: "ci/daileon-ci"

  deployments:
    - environment: production
      url: http://localhost:5173
      server_name: srv-prod-portal01
      server_ip: 192.168.10.100
      os: "Linux Ubuntu 22.04 LTS"
      execution_type: Docker
      port: 5173
      notes: "Ambiente principal de produção do Daileon"
      
    - environment: test
      url: http://localhost:8000
      server_name: srv-test-portal01
      server_ip: 192.168.20.100
      os: "Windows Server 2022"
      execution_type: VM
      port: 8000
      notes: "Servidor de testes e homologação local"


